name: CI/CD Pipeline - Docker Hub

on:
  push:
    branches: [ "main" ] # Dispara automaticamente ao fazer push na main
  workflow_dispatch:     # Permite clicar em "Run workflow" manualmente lá no painel do GitHub

jobs:
  build-and-push-java:
    name: Build & Push Backend Java
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout do código
        uses: actions/checkout@v4

      - name: 2. Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 3. Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 4. Build e Push da Imagem Java
        uses: docker/build-push-action@v5
        with:
          context: . # Se o backend estiver dentro de uma subpasta, mude para ./pasta-do-backend
          file: ./Dockerfile
          push: true
          # Isso vai gerar uma tag com a versão mais recente
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/neoframe-backend:latest
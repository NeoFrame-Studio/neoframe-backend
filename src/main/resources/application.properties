spring.application.name=neoframe-backend

jwt.secret=${JWT_SECRET_KEY}

spring.datasource.url=jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:neoframe}
spring.datasource.username=${PGUSER:postgres}
spring.datasource.password=${PGPASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

app.cors.allowed-origins=${SERVER_JAVA_URL}


app.worker.python-url=${PYTHON_WORKER_URL_PROCESS}

app.worker.connect-timeout=5000
app.worker.read-timeout=10000


app.internal.api-key = ${INTERNAL_API_KEY}

app.jwt.secret = ${JWT_SECRET_KEY}
app.jwt.expiration-ms=86400000

#app.google.client-id=${GOOGLE_CLIENT_ID:seu-client-id-do-google-placeholder.apps.googleusercontent.com}
app.google.client-id=${GOOGLE_CLIENT_ID}


server.java.url = ${SERVER_JAVA_URL}

worker.url=${WORKER_URL}
python.worker.url.scraper.images=${PYTHON_SCRAPER_URL}


supabase.url=${SUPABASE_URL}
supabase.key=${SUPABASE_KEY}
supabase.bucket=${SUPABASE_BUCKET}

server.forward-headers-strategy=framework
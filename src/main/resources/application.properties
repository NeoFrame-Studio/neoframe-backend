spring.application.name=neoframe-backend

jwt.secret=${JWT_SECRET_KEY}

supabase.url=${SUPABASE_URL}
supabase.service-role-key=${SUPABASE_KEY}
supabase.bucket.name=${SUPABASE_BUCKET}

spring.datasource.url=jdbc:postgresql://${PGHOST}:${PGPORT}/${PGDATABASE}
spring.datasource.username=${PGUSER}
spring.datasource.password=${PGPASSWORD}

# Flyway Migration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

app.cors.allowed-origins=http://localhost:5173

###

# ===================================================================
# WORKER PYTHON CONFIGURATION
# ===================================================================
# URL do Hugging Face. Em desenvolvimento você pode usar localhost se rodar o Python local
app.worker.python-url=${PYTHON_WORKER_URL_PROCESS}

# Timeouts em milissegundos (5000ms = 5s / 10000ms = 10s)
app.worker.connect-timeout=5000
app.worker.read-timeout=10000


# Chave mestra de comunicação interna (Mude para uma string segura no Railway)
app.internal.api-key=${INTERNAL_API_KEY:neoframe-secret-key-123}

worker.url=${WORKER_URL}
python.worker.url.scraper.images=${PYTHON_SCRAPER_URL}

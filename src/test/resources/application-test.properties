spring.application.name=neoframe-backend


spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

spring.flyway.enabled=false

jwt.secret=ChaveSecretaSuperSeguraParaTestesUnitariosSomente1234567890
app.jwt.secret=ChaveSecretaSuperSeguraParaTestesUnitariosSomente1234567890
app.jwt.expiration-ms=86400000
app.internal.api-key=internal-api-key-ficticia

app.google.client-id=client-id-ficticio-para-testes

supabase.url=https://mock.supabase.co
supabase.key=mock-supabase-key
supabase.bucket=mock-bucket

app.cors.allowed-origins=http://localhost:8080
server.java.url=http://localhost:8080
worker.url=http://localhost:8002
app.worker.python-url=http://localhost:8001
python.worker.url.scraper.images=http://localhost:8003

app.worker.connect-timeout=5000
app.worker.read-timeout=10000


server.forward-headers-strategy=framework